
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Bliss - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            color: #3e2723;
        }

        nav {
            background: #4e342e;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #ffcc80;
        }

        .login-container {
            width: min(90%, 400px);
            margin: 65px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000018;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c7b8ae;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #6d4c41;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3e2723;
        }

        button:disabled {
            background: #a1887f;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }

        footer {
            background: #4e342e;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 480px) {
            nav {
                justify-content: center;
            }

            nav ul {
                gap: 15px;
            }

            .login-container {
                padding: 25px;
                margin: 40px auto;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">☕ Cafe Bliss</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Login Form -->
    <div class="login-container">
        <h1>Login ☕</h1>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">Login</button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Cafe Bliss | Made with ❤️</p>
    </footer>

    <!-- Google Sheets Connection -->
    <script>
        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const username = document
                    .getElementById("username")
                    .value.trim();

                const message = document.getElementById("message");
                const loginButton = document.getElementById("loginButton");

                // Your Google Apps Script Web App URL
                const scriptURL =
                    "https://script.google.com/macros/s/AKfycbxSshYEyQiV-F5KCvK5_KjofUR_r-Wd0ejKnRg-Wl_pTENJ9Pls0bLh4bfJpxoEQPon5A/exec";

                if (!username) {
                    message.textContent = "Please enter your username.";
                    return;
                }

                message.textContent = "Submitting...";
                loginButton.disabled = true;

                try {
                    await fetch(scriptURL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },
                        body: new URLSearchParams({
                            username: username
                        })
                    });

                    message.textContent =
                        "Request sent! Please check your Google Sheet.";

                    document.getElementById("loginForm").reset();

                } catch (error) {
                    message.textContent =
                        "Unable to send the request. Please try again.";
                } finally {
                    loginButton.disabled = false;
                }
            }
        );
    </script>

</body>
</html>
